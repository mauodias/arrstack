---
# Homepage dashboard service definitions.
# Unlike other config/* directories in this repo (which are runtime state
# managed by each app's own UI/database and are never committed), this file
# is human-authored infrastructure for the Homepage dashboard and IS
# committed to git — as are settings.yaml (layout/theme), widgets.yaml
# (the info-widget header row) and custom.css.
#
# Group names below MUST match the `layout:` keys in settings.yaml exactly,
# or the group loses its icon/column settings and sorts alphabetically.
# settings.yaml also assigns each group to a tab; Stats leads that list and
# is therefore the tab shown on load.
#
# Most apps are reachable via Tailscale at http://arr-vps:<port>.
# qBittorrent is the exception: it lives in gluetun's network namespace and
# is reached over the Tailscale subnet route at 172.28.0.10:8080.
#
# Widget API keys are injected via {{HOMEPAGE_VAR_XXX}} placeholders, which
# Homepage substitutes at runtime from HOMEPAGE_VAR_* environment variables
# (see docker-compose.yml's homepage service and .env.example).

- Stats:
    # Queries Hetzner's own Cloud API directly, with a read-only API token.
    # rclone can't provide this data: Hetzner's WebDAV endpoint never returns
    # quota properties (RFC 4331), so `rclone about` always returns an empty
    # object for this account. Hetzner's account only has one Storage Box,
    # so `storage_boxes.0` is safe; a second box would need targeting by id
    # instead of index 0. mdi- icon because dashboard-icons has no Hetzner
    # Storage Box logo.
    - Hetzner Storage Box:
        href: https://console.hetzner.com/projects
        icon: mdi-harddisk
        # Sourced from HETZNER_STORAGEBOX_USER via HOMEPAGE_VAR templating
        # (docker-compose.yml) — the same mechanism used for widget API keys
        # works in any field of this file, not just inside widget: blocks.
        # Kept out of the widget's own `mappings`: it's a subtitle, not tile
        # data, and doesn't need a live API call since it's static per-account.
        description: "User ID: {{HOMEPAGE_VAR_HETZNER_STORAGEBOX_USER}}"
        widget:
          type: customapi
          url: https://api.hetzner.com/v1/storage_boxes
          method: GET
          headers:
            Authorization: "Bearer {{HOMEPAGE_VAR_HETZNER_API_TOKEN}}"
          mappings:
            - field: storage_boxes.0.stats.size
              label: Used
              format: bytes
            - field: storage_boxes.0.storage_box_type.size
              label: Total
              format: bytes

    # Iframe widget, so the browser fetches this URL itself — Homepage does
    # NOT proxy iframe widgets. That is why the metrics container shares
    # tailscale's network namespace: the src has to resolve from the laptop
    # exactly like http://arr-vps:3000 does, not just from inside Docker.
    #
    # `classes` is the stock ceiling (h-96); custom.css overrides the height
    # past what Homepage's precompiled Tailwind bundle can express.
    - Stack metrics:
        href: http://arr-vps:8099
        icon: mdi-chart-line
        description: Disk, transfer and backlog history
        widget:
          type: iframe
          name: metrics
          src: http://arr-vps:8099/?range=24h
          classes: h-96
          referrerPolicy: same-origin
          refreshInterval: 300000

- Watch & Request:
    - Jellyfin:
        href: http://arr-vps:8096
        icon: jellyfin.png
        description: Movies & TV streaming
        widget:
          type: jellyfin
          url: http://arr-vps:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"

    # Navidrome: no live-stats widget configured. Homepage's `navidrome`
    # widget type requires Subsonic-style MD5(password+salt) token auth
    # (url, user, token, salt) which is too complex to template cleanly
    # via a simple API key. If desired later, add a widget block here with
    # a manually-generated Subsonic token/salt pair — see
    # https://gethomepage.dev/widgets/services/navidrome/
    - Navidrome:
        href: http://arr-vps:4533
        icon: navidrome.png
        description: Music streaming

    - Seerr:
        href: http://arr-vps:5055
        icon: seerr.png
        description: Request movies & shows
        widget:
          type: seerr
          url: http://arr-vps:5055
          key: "{{HOMEPAGE_VAR_SEERR_KEY}}"

- Libraries:
    - Radarr:
        href: http://arr-vps:7878
        icon: radarr.png
        description: Movie library
        widget:
          type: radarr
          url: http://arr-vps:7878
          key: "{{HOMEPAGE_VAR_RADARR_KEY}}"

    - Sonarr:
        href: http://arr-vps:8989
        icon: sonarr.png
        description: TV library
        widget:
          type: sonarr
          url: http://arr-vps:8989
          key: "{{HOMEPAGE_VAR_SONARR_KEY}}"

    - Lidarr:
        href: http://arr-vps:8686
        icon: lidarr.png
        description: Music library
        widget:
          type: lidarr
          url: http://arr-vps:8686
          key: "{{HOMEPAGE_VAR_LIDARR_KEY}}"

    - Bazarr:
        href: http://arr-vps:6767
        icon: bazarr.png
        description: Subtitles
        widget:
          type: bazarr
          url: http://arr-vps:6767
          key: "{{HOMEPAGE_VAR_BAZARR_KEY}}"

- Acquisition:
    - Prowlarr:
        href: http://arr-vps:9696
        icon: prowlarr.png
        description: Indexer manager
        widget:
          type: prowlarr
          url: http://arr-vps:9696
          key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"

    # qBittorrent uses 172.28.0.10:8080 (gluetun's fixed IP on the vpn_net
    # subnet route, NOT arr-vps) to keep qBittorrent/gluetun isolated for
    # VPN safety.
    - qBittorrent:
        href: http://172.28.0.10:8080
        icon: qbittorrent.png
        description: Torrents, VPN-isolated via gluetun
        widget:
          type: qbittorrent
          url: http://172.28.0.10:8080
          username: "{{HOMEPAGE_VAR_QBT_USERNAME}}"
          password: "{{HOMEPAGE_VAR_QBT_PASSWORD}}"
          enableLeechProgress: true

    # The stock qbittorrent widget above exposes only leech/download/seed/
    # upload. This pulls qBittorrent's own aggregate state for the numbers it
    # cannot reach — notably connection_status, which reports `firewalled`
    # when the listen port is not actually reachable, and total_queued_size,
    # which shows work waiting on a free slot from the queueing limits.
    - Torrent activity:
        icon: mdi-swap-vertical-bold
        description: qBittorrent aggregate state
        widget:
          type: customapi
          url: http://172.28.0.10:8080/api/v2/sync/maindata?rid=0
          username: "{{HOMEPAGE_VAR_QBT_USERNAME}}"
          password: "{{HOMEPAGE_VAR_QBT_PASSWORD}}"
          mappings:
            - field: server_state.connection_status
              label: Status
              format: text
            - field: server_state.global_ratio
              label: Ratio
              format: text
            - field: server_state.total_queued_size
              label: Queued
              format: bytes
            - field: server_state.alltime_ul
              label: Shared
              format: bytes

    # Reached at gluetun's fixed vpn_net address rather than arr-vps: slskd
    # shares gluetun's network namespace for VPN isolation, so it is not
    # bound to the Tailscale hostname.
    - slskd:
        href: http://172.28.0.10:5030
        icon: slskd.png
        description: Soulseek P2P, VPN-isolated via gluetun
        widget:
          type: slskd
          url: http://172.28.0.10:5030
          key: "{{HOMEPAGE_VAR_SLSKD_KEY}}"

    # The stock slskd widget above shows only current queue/download counts.
    # This pulls the aggregated numbers from the metrics container's own
    # /summary.json (see docker-compose.yml's metrics service), which is the
    # only place slskd's cumulative per-outcome totals and success rate are
    # computed — Homepage's customapi widget can only extract fields by dot
    # path, it cannot aggregate slskd's raw transfer list itself. Reached at
    # arr-vps like the other customapi widget on this dashboard, unlike the
    # `Stack metrics` iframe: customapi IS proxied server-side by Homepage,
    # so it can resolve the Tailscale hostname from inside Docker.
    - Soulseek activity:
        icon: mdi-account-music
        description: slskd aggregate download health
        widget:
          type: customapi
          url: http://arr-vps:8099/summary.json
          mappings:
            - field: slskd.downloads.active
              label: Active
              format: number
            - field: slskd.downloads.queued
              label: Queued
              format: number
            - field: slskd.downloads.speed_bps
              label: Speed
              format: bitrate
              scale: 8
            - field: slskd.downloads.success_rate
              label: Success rate
              format: percent
              scale: 0.01

    # Scanned hourly rather than every cycle: walking several thousand files
    # over the FUSE mount is expensive, and the figure only moves on import.
    - Old collection:
        icon: mdi-archive-clock-outline
        description: Legacy library awaiting import
        widget:
          type: customapi
          url: http://arr-vps:8099/summary.json
          mappings:
            - field: old_collection.size_bytes
              label: Size
              format: bytes
            - field: old_collection.folders
              label: Folders
              format: number
            - field: old_collection.files
              label: Files
              format: number
            - field: old_collection.scanned_at
              label: Scanned
              format: relativeDate

    # soularr: plain link, no widget — it exposes no stats API. The tile is
    # for quick access to its minimal UI, which shows the generated
    # config.ini. mdi- icon because dashboard-icons has no soularr logo.
    - soularr:
        href: http://arr-vps:8265
        icon: mdi-transit-connection-variant
        description: Bridges Lidarr wanted list to slskd
