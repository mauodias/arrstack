---
# Homepage information widgets (the header row above the service groups).
# Human-authored, committed to git, fetched from GitHub by bootstrap/init.sh
# on every deploy — same treatment as services.yaml and settings.yaml.

- datetime:
    text_size: xl
    locale: en-GB
    format:
      dateStyle: medium
      timeStyle: short
      hourCycle: h23

# Open-Meteo needs no API key or registration.
- openmeteo:
    label: Amsterdam
    latitude: 52.3676
    longitude: 4.9041
    timezone: Europe/Amsterdam
    units: metric
    cache: 15

# Two different storage figures, each answering a different question:
#   - Hetzner Storage Box capacity -> the customapi widget in services.yaml,
#     i.e. how much of the 1 TB library allowance is left.
#   - `disk:` below -> the VPS partition holding qBittorrent's temp path
#     (/config/incomplete). In-progress downloads land here and only move to
#     the box once complete, so a climbing figure means transfers are piling
#     up locally instead of draining to remote storage.
- resources:
    label: VPS
    cpu: true
    memory: true
    uptime: true
    disk: /hostdisk/qbittorrent

- search:
    provider: duckduckgo
    showSearchSuggestions: true
    target: _blank
