---
# Homepage information widgets (the header row above the service groups).
# Human-authored, committed to git, fetched from GitHub by bootstrap/init.sh
# on every deploy — same treatment as services.yaml and settings.yaml.

- datetime:
    text_size: xl
    locale: en-GB
    format:
      dateStyle: medium
      timeStyle: short
      hourCycle: h23

# Open-Meteo needs no API key or registration.
- openmeteo:
    label: Amsterdam
    latitude: 52.3676
    longitude: 4.9041
    timezone: Europe/Amsterdam
    units: metric
    cache: 15

# Deliberately no `disk:` here — the only storage figure worth surfacing is
# Hetzner Storage Box capacity, which is the customapi widget in
# services.yaml. A local-disk reading would report the VPS's own partition
# and read as a second, contradictory "storage" number on the same page.
- resources:
    label: VPS
    cpu: true
    memory: true
    uptime: true

- search:
    provider: duckduckgo
    showSearchSuggestions: true
    target: _blank
